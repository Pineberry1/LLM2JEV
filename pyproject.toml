[project]
name = "llm2jev"
version = "0.1.0"
description = "Reproducible shared-prefix attention experiments for parallel LLM decisions"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "triton>=3.0"]

[project.optional-dependencies]
model = ["transformers>=4.51", "safetensors"]
flashinfer = ["flashinfer-python>=0.6.13,<0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
